[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "ai-systems-lab"
version = "0.1.0"
description = "A command-line application for asking questions about AI research papers."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.24,<3",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
]


[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]


[project.scripts]
ai-systems-lab = "ai_systems_lab.main:main"


[tool.setuptools.packages.find]
where = ["src"]
